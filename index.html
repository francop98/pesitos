<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pesitos · Tu economista de bolsillo</title>
  <meta name="description" content="Pesitos: registrá rápido, ordená solo y hacé crecer tu plata.">
  <meta name="theme-color" content="#1F6F4A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>/* Tema y tamaño de letra elegidos en el menú (antes de dibujar, para que no parpadee) */
    try { var t = localStorage.getItem('pesitos_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
      var l = localStorage.getItem('pesitos_letra'); if (l === 'grande' || l === 'enorme') document.documentElement.setAttribute('data-letra', l); } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <main id="app" aria-live="polite"></main>
  </div>

  <nav id="nav" class="nav" aria-label="Secciones" hidden>
    <a href="#/inicio" data-route="inicio"><span data-icon="home"></span>Inicio</a>
    <a href="#/movimientos" data-route="movimientos"><span data-icon="moves"></span>Movimientos</a>
    <a href="#/sueldo" data-route="sueldo"><span data-icon="trend"></span>Sueldo</a>
    <a href="#/ahorro" data-route="ahorro"><span data-icon="sprout"></span>Ahorro</a>
    <a href="#/asesor" data-route="asesor"><span data-icon="chat"></span>Asesor</a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="closeModal"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
